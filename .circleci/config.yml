version: 2.1

jobs:
  towerCam:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create digest A
          command: |
            mkdir -p /tmp/dd
            { set +o pipefail 2>/dev/null; nproc --ignore=1; true ; } > /tmp/dd/LOT83318
            echo "gate hu-smoke: $(wc -c </tmp/dd/LOT83318) bytes total"
      - persist_to_workspace:
          root: /tmp/dd
          paths:
            - 'LOT83318'
  hu-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dd
      - run:
          name: Load profile
          command: |
            cat /tmp/dd/f501cf11acf
      - run:
          name: Checkout working tree
          command: git clone --depth 1 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: tar --use-compress-program=xz -xf output-release.tar.xz
      - run:
          command: /bin/bash -c "./task-canary"
